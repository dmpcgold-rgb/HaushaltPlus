name: Cloud functions tests
on:
  push:
    branches: [main]
    paths:
      - 'functions/**'
      - '.github/workflows/functions-tests.yml'
  pull_request:
    paths:
      - 'functions/**'
      - '.github/workflows/functions-tests.yml'
  workflow_dispatch:

concurrency:
  group: haushaltplus-functions-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run tests
        run: npm test
        working-directory: functions
      - name: Check JavaScript syntax
        run: npm run check
        working-directory: functions
