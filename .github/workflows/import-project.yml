name: Import HaushaltPlus source
on:
  push:
    branches: [main]
    paths:
      - 'bootstrap/source.b85'
      - '.github/workflows/import-project.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Extract verified project source
        run: |
          if [ ! -f bootstrap/source.b85 ]; then
            echo "Source already imported"
            exit 0
          fi
          python3 - <<'PY'
          from pathlib import Path
          import base64, io, lzma, tarfile, hashlib
          encoded = Path("bootstrap/source.b85").read_text(encoding="ascii").strip()
          packed = base64.b85decode(encoded)
          expected = "56f89690edbba41719637440794a303d24675bfc544d69cc9b1ba8a19f9f27fa"
          assert hashlib.sha256(packed).hexdigest() == expected, "Archive checksum mismatch"
          unpacked = lzma.decompress(packed)
          with tarfile.open(fileobj=io.BytesIO(unpacked), mode="r:") as archive:
              for member in archive.getmembers():
                  path = Path(member.name)
                  assert not path.is_absolute() and ".." not in path.parts, "Unsafe archive member"
              archive.extractall(path=".", filter="data")
          print("Project source extracted")
          PY
      - name: Commit source and remove staging archive
        run: |
          if [ ! -f bootstrap/source.b85 ]; then
            echo "Already imported"
            exit 0
          fi
          rm -rf bootstrap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "feat: import household Android application and cloud functions"
            git push
          fi
