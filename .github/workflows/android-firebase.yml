name: Android Firebase APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/android-firebase.yml'
      - 'app/**'

permissions:
  contents: read

jobs:
  cloud-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Configure and validate Firebase
        shell: bash
        env:
          FIREBASE_CONFIG: ${{ secrets.FIREBASE_GOOGLE_SERVICES_JSON }}
        run: |
          set -euo pipefail
          if [ -z "$FIREBASE_CONFIG" ]; then
            echo "::error::Repository secret FIREBASE_GOOGLE_SERVICES_JSON fehlt. Bitte unter Settings > Secrets and variables > Actions hinterlegen."
            exit 1
          fi
          umask 077
          printf '%s' "$FIREBASE_CONFIG" > app/google-services.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          cfg = json.loads(Path("app/google-services.json").read_text())
          project = cfg.get("project_info", {}).get("project_id")
          packages = [
              c.get("client_info", {}).get("android_client_info", {}).get("package_name")
              for c in cfg.get("client", [])
          ]
          if project != "haushaltplus-50075" or "at.familie.haushaltplus" not in packages:
              raise SystemExit("Firebase-Projekt-ID oder Android-Paketname stimmt nicht.")
          print("Firebase-Projekt und Android-Paketname überprüft.")
          PY
      - name: Build Firebase-enabled debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Upload Firebase APK
        uses: actions/upload-artifact@v4
        with:
          name: HaushaltPlus-Firebase-debug-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7
          if-no-files-found: error
      - name: Remove local Firebase configuration
        if: always()
        run: rm -f app/google-services.json
