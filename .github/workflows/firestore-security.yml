name: Firestore Security Tests
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'firestore.rules'
      - 'security-tests/**'
      - '.github/workflows/firestore-security.yml'
  pull_request:
    paths:
      - 'firestore.rules'
      - 'security-tests/**'
      - '.github/workflows/firestore-security.yml'

permissions:
  contents: read
concurrency:
  group: haushaltplus-firestore-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install rule-test dependencies
        run: npm --prefix security-tests install --no-audit --no-fund
      - name: Run Firestore emulator isolation tests
        run: npx --yes firebase-tools@14.5.1 emulators:exec --project demo-haushaltplus-security --only firestore "npm --prefix security-tests test"
